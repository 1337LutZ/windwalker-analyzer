  fightRankings(bracket: Int = 0, difficulty: Int = 0, filter: String = "", page: Int = 1, partition: Int = 0, serverRegion: String = "", serverSlug: String = "", size: Int = 0, leaderboard: LeaderboardRank = Any, hardModeLevel: HardModeLevelRankFilter = Any, metric: FightRankingMetricType = default, includeOtherPlayers: Boolean = false): JSON
  """The zone that this encounter is found in."""
  zone: Zone!
  """The Blizzard journal ID, used as the identifier in the encounter journal and various Blizzard APIs like progression."""
  journalID: Int!
}

type EncounterPhases {
