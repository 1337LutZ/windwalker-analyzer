# The report's actor roster. Event payloads carry only report-local IDs, so this is the only way to
# turn a sourceID or targetID into a name, and the only way to tell a player's pets from the player.

query ReportActors($code: String!) {
	# The hourly point budget, riding along for free: measured, this document costs the same with the
	# field as without it, while asking for it alone costs a point. See rateLimit.ts.
	rateLimitData {
		limitPerHour
		pointsSpentThisHour
		pointsResetIn
	}
	reportData {
		report(code: $code) {
			masterData {
				actors {
					id
					name
					type
					subType
					petOwner
				}
			}
		}
	}
}
