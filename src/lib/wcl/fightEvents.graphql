# One page of every event the player was the source of.
#
# `dataType: All` on purpose. A query costs the same point whether it returns 61 bytes or 500 KB, and
# `filterExpression` or a narrower `dataType` saves bandwidth but not points — so fetching casts,
# buffs, debuffs and damage in one wide pass costs one point per page, while fetching them per
# ability would cost one point per ability and still return strictly less.
#
# `limit` does not set the page size: the server pages on its own schedule and signals more data with
# `nextPageTimestamp`. Callers must follow that cursor to exhaustion, or a nine-minute pull silently
# becomes its first ninety seconds.
#
# `includeResources: true` is what puts the energy bar in the payload, and it is free.
#
# It defaults to false, and without it *no* event carries a `classResources` array — which is why
# this report spent its first version asserting that an energy curve could not be rebuilt from a
# WarcraftLogs log. With it, roughly two thirds of the events on a pull arrive carrying
# `resourceActor` and `classResources: [{ amount, max, type, cost }]`, sampled about three times a
# second. That is the curve, read rather than inferred: `max` comes back with every sample, so a
# talent that widens the bar needs no guessing at either.
#
# Measured against `rateLimitData.pointsSpentThisHour` before and after: the flag costs zero extra
# points. It roughly doubles the bytes on the wire, which the paging loop absorbs, and points are
# the budget that actually runs out.
#
# `data` is the untyped JSON scalar — the schema cannot describe a combat-log event — so codegen
# types it `unknown` and it is narrowed through ~/lib/events.

query FightEvents($code: String!, $fightID: Int!, $sourceID: Int!, $startTime: Float!, $endTime: Float!) {
	# The hourly point budget, riding along for free: measured, this document costs the same with the
	# field as without it, while asking for it alone costs a point. See rateLimit.ts.
	rateLimitData {
		limitPerHour
		pointsSpentThisHour
		pointsResetIn
	}
	reportData {
		report(code: $code) {
			events(
				fightIDs: [$fightID]
				dataType: All
				sourceID: $sourceID
				startTime: $startTime
				endTime: $endTime
				includeResources: true
				limit: 10000
			) {
				data
				nextPageTimestamp
			}
		}
	}
}
