# Report header plus every fight. `friendlyPlayers` is why one query can answer "which pulls was X
# in" without a second request per fight.
#
# Every timestamp the API returns here is milliseconds relative to the report start, except the
# report's own startTime/endTime, which are epoch.

query ReportFights($code: String!) {
	# The hourly point budget, riding along for free: measured, this document costs the same with the
	# field as without it, while asking for it alone costs a point. See rateLimit.ts.
	rateLimitData {
		limitPerHour
		pointsSpentThisHour
		pointsResetIn
	}
	reportData {
		report(code: $code) {
			title
			startTime
			endTime
			zone {
				id
				name
				# The zone names its own difficulties, so the report can label a pull without this app
				# holding a table of ids. The ids are not portable: on Classic, 4 is Heroic at either
				# raid size, while the same id on retail means something else again — and raid size is
				# a separate field, not part of the difficulty.
				difficulties {
					id
					name
				}
			}
			# The static phase list for every encounter this report saw, which is what names a
			# transition. Free: measured, this document costs 1.01 points with these fields and 1.01
			# without, because WCL prices a request by its heaviest resolver and `phases` is documented
			# as not double-charging a query that already loads fights.
			phases {
				encounterID
				# WarcraftLogs' own word on whether this encounter's phase list is good enough to split
				# wipes by. False on most of Siege of Orgrimmar, and read rather than assumed.
				separatesWipes
				phases {
					id
					name
					isIntermission
				}
			}
			fights {
				id
				name
				encounterID
				kill
				difficulty
				size
				fightPercentage
				startTime
				endTime
				friendlyPlayers
				enemyNPCs {
					id
					gameID
				}
				# When this pull actually entered each phase. `id` is 1-indexed and joins to the
				# metadata above; it repeats, because a fight that re-enters phase one reports id 1
				# twice, so this is a list of transitions and not a list of phases. Null on an
				# encounter WarcraftLogs has no phases for.
				phaseTransitions {
					id
					startTime
				}
			}
		}
	}
}
