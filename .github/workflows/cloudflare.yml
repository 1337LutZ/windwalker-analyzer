name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # So a failed or superseded deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# One live site. Queue pushes rather than racing them, and never cancel a deploy mid-upload — that
# is how a half-published site happens.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  # Named once. It has to match the Cloudflare project and the `site` the build was made for, and
  # `windwalker-analyzer.pages.dev` is derived from it.
  PROJECT_NAME: windwalker-analyzer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The gates that decide whether this build deserves to be published. A deploy that skips them
      # publishes whatever happens to compile.
      #
      # Through `npm run`, not `npx <tool>`. `npx` falls back to *downloading* a tool that is not a
      # declared dependency, so CI silently ran a different version from the one on this machine —
      # which is exactly how the first deploy failed: a formatter build newer than the local one
      # disagreed about a JSON file that was, locally, correctly formatted.
      - run: npm run check
      - run: npm test

      # `src/pages/preview.astro` is a development harness: it renders committed fixtures so charts
      # and copy can be checked without a token. It has no place on the public site, and removing
      # the page removes its only import of the fixture JSON, so none of that data is bundled.
      # Deleted here rather than from the repo so the harness stays available in `npm run dev`.
      - name: Drop the fixture preview harness from the published build
        run: rm -f src/pages/preview.astro

      - run: npm run build

      # Wrangler is run directly rather than through `cloudflare/wrangler-action`. The action looks
      # for a local wrangler, does not find one it accepts, and installs its own — measured: it
      # pulled 3.90.0 while current is 4.x. Wrangler is a declared, pinned dependency here for the
      # same reason every other tool is, so the version that deploys is the version in the lockfile.
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotent, so the first deploy on a fresh account needs no dashboard visit and later ones
        # cost one API call. `project list` failing is a real error — a bad token, or one without the
        # Pages permission — and is left to fail the job rather than being swallowed by `|| true`.
        run: |
          if npx --no-install wrangler pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME already exists."
          else
            echo "Project $PROJECT_NAME not found; creating it."
            npx --no-install wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--branch=main` marks this a production deployment; without it Cloudflare treats the upload
        # as a preview and the production URL never moves.
        #
        # `--commit-dirty=true` because the tree deliberately *is* dirty: the preview harness was
        # deleted a few steps above. Without it wrangler warns on every single deploy about a change
        # this workflow made on purpose.
        run: npx --no-install wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
