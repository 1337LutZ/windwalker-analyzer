name: Deploy Elemental to Cloudflare Pages

# The Elemental half of the pair. See `cloudflare-windwalker.yml` for the other one, and
# `deploy-cloudflare.yml` for every step either of them runs.
#
# A push to `main` publishes both sites, from the same commit, through two independent runs. That is
# the intent rather than a side effect: one repository, one report engine, two spec-pinned front
# doors — a change to the shared core has to reach both, or the two sites disagree about what the
# same log means.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-elemental
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      project_name: elemental-analyzer
      spec: elemental
      # Has to be registered with WarcraftLogs as a redirect URI in its own right. The client id is
      # per person and pasted in by the visitor, but the redirect host is per site, and this is not
      # the Windwalker's.
      site_url: https://elemental-analyzer.pages.dev
    secrets: inherit
