name: Deploy to Cloudflare Pages (reusable)

# The deploy itself: the gates a build has to pass, and the upload that follows them.
#
# One site now, not two. `mop-log-analyzer` serves every registered spec by route — `/monk/windwalker`,
# `/shaman/elemental`, a splash at `/` — so the thing that used to differ between the two runs, the
# spec each build was pinned to, no longer exists. What is left is a project name and a canonical URL,
# and both come from the caller.
#
# The argument that used to keep this file separate from its caller was that a copy is where two
# deploys drift, and that argument died with the second site. The narrower one that replaces it: the
# caller's `with:` block is the single visible place that says *where* the site lands, and a required
# `workflow_call` input is checked by GitHub before anything runs, so a caller that forgets one fails
# instead of publishing against whatever `astro.config.mjs` happens to default to.
on:
  workflow_call:
    inputs:
      project_name:
        description: >-
          The Cloudflare Pages project to publish to. Its `.pages.dev` host is derived from this.
        required: true
        type: string
      site_url:
        description: >-
          Astro's `site` — the host this build is made for. Passed rather than left to default,
          because `astro.config.mjs` names a host of its own and the build would otherwise carry it.

          Half of that is still latent, and the other half is why this input is required.

          The latent half is the asset URLs. `base` is empty on Pages, so every asset URL is
          root-relative and nothing in the emitted HTML names the host, which means a wrong value
          here still publishes a site that works. It stops being latent the moment anything canonical
          is emitted — a `<link rel="canonical">`, an `og:url`, a sitemap.

          The load-bearing half is sign-in, and moving from two sites to one made it heavier rather
          than lighter. WarcraftLogs matches the OAuth redirect URI byte for byte against a URI
          registered on each visitor's *own* client, and `redirectUri()` builds that URI from the
          origin the page is served from. So the host named here is the string every user has to have
          registered, and there is now exactly one of them where there used to be one per spec. The
          two hosts it replaces 301 to this one, so signing in on an old host is not a fallback: a
          callback cannot land on a host that redirects, and the verifier and state the exchange
          needs were written to the old origin's `sessionStorage`, which this origin cannot read.
          Naming the wrong host here does not publish a broken-looking site. It publishes a working
          one that nobody can sign in to, under an error that blames their client id. See
          `docs/wcl-oauth.md`.
        required: true
        type: string

permissions:
  contents: read

# `PROJECT_NAME` only, and `SITE_URL` deliberately not beside it. A workflow-level `env:` reaches
# every step, the gates included, and a gate that can see a build variable is a gate answering a
# question about the deployment rather than about the code.
#
# What that rule was written from: the build used to carry a second variable, `PUBLIC_SPEC`, pinning
# each site to one spec, and it was set job-wide. Vitest puts the whole process environment onto
# `import.meta.env`, so the pin reached `DEFAULT_SPEC` *inside the test run* — the suite renders
# Windwalker fixtures through it, and the Elemental deploy failed 96 tests across 18 files while the
# Windwalker one passed only because `windwalker` was `SPECS[0]`, the value the fallback would have
# chosen anyway. One of two sites went red for a reason that had nothing to do with the code it was
# publishing.
#
# That variable is gone: one build serves every spec by route, so nothing pins a spec any more and
# that exact failure cannot recur. `SITE_URL` is what the rule now applies to, and the honest reading
# is that hoisting it would break nothing today — `astro check` would read it and set `site`, and
# vitest never loads `astro.config.mjs` at all. It stays on the build step regardless, because the
# reason a gate must not see a build variable was never that this particular one bites.
env:
  PROJECT_NAME: ${{ inputs.project_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The gates that decide whether this build deserves to be published. A deploy that skips them
      # publishes whatever happens to compile.
      #
      # They cover every registered spec in one pass, which used to be a deliberate choice against
      # the grain of two spec-pinned sites and is now simply what the site is: one build, every spec,
      # so a change that breaks the Elemental audit breaks the page a Windwalker visitor lands on.
      #
      # Through `npm run`, not `npx <tool>`. `npx` falls back to *downloading* a tool that is not a
      # declared dependency, so CI silently ran a different version from the one on this machine —
      # which is exactly how the first deploy failed: a formatter build newer than the local one
      # disagreed about a JSON file that was, locally, correctly formatted.
      - run: npm run check
      - run: npm test

      # `src/pages/preview.astro` is a development harness: it renders committed fixtures so charts
      # and copy can be checked without a token. It has no place on the public site, and removing
      # the page removes its only import of the fixture JSON, so none of that data is bundled.
      # Deleted here rather than from the repo so the harness stays available in `npm run dev`.
      - name: Drop the fixture preview harness from the published build
        run: rm -f src/pages/preview.astro

      # `SITE_URL` is set here, on the one step that needs it, rather than on the job — the `env:`
      # block above holds the incident that rule was written from. `astro.config.mjs` reads it from
      # `process.env`, which is a different channel from `.env` and does not read that file.
      - run: npm run build
        env:
          SITE_URL: ${{ inputs.site_url }}

      # Wrangler is run directly rather than through `cloudflare/wrangler-action`. The action looks
      # for a local wrangler, does not find one it accepts, and installs its own — measured: it
      # pulled 3.90.0 while current is 4.x. Wrangler is a declared, pinned dependency here for the
      # same reason every other tool is, so the version that deploys is the version in the lockfile.
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotent, so a fresh account needs no dashboard visit and every later deploy costs one
        # API call. `project list` failing is a real error — a bad token, or one without the Pages
        # permission — and is left to fail the job rather than being swallowed by `|| true`.
        #
        # `grep -qw` against the whole list, so the project names in the account have to stay
        # distinguishable under word boundaries. Still worth saying with one project deployed from
        # here, because the account holds more than one: `windwalker-analyzer` and
        # `elemental-analyzer` are kept alive by hand as 301s to this site, so the list this greps
        # has three names in it, and none of the three is a substring of another.
        run: |
          if npx --no-install wrangler pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME already exists."
          else
            echo "Project $PROJECT_NAME not found; creating it."
            npx --no-install wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--branch=main` marks this a production deployment; without it Cloudflare treats the upload
        # as a preview and the production URL never moves.
        #
        # `--commit-dirty=true` because the tree deliberately *is* dirty: the preview harness was
        # deleted a few steps above. Without it wrangler warns on every single deploy about a change
        # this workflow made on purpose.
        run: npx --no-install wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
