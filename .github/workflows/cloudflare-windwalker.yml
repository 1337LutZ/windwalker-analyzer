name: Deploy Windwalker to Cloudflare Pages

# The Windwalker half of the pair. See `cloudflare-elemental.yml` for the other one, and
# `deploy-cloudflare.yml` for every step either of them runs.
#
# Named for its spec rather than for its host, the same as its sibling: with two sites published from
# one repository, a file called `cloudflare.yml` reads as *the* Cloudflare deploy and the Elemental
# one as an afterthought bolted beside it. Neither is the default. This file's whole job is to say
# *which* site a push publishes, and to own that site's queue.
on:
  push:
    branches: [main]
  # So a failed or superseded deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# One live site per spec. Queue pushes rather than racing them, and never cancel a deploy mid-upload
# — that is how a half-published site happens.
#
# The group carries the spec, so the two sites queue independently: an Elemental deploy already
# uploading is not a reason to hold the Windwalker's, and a shared group would make it one.
concurrency:
  group: cloudflare-pages-windwalker
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      project_name: windwalker-analyzer
      spec: windwalker
      site_url: https://windwalker-analyzer.pages.dev
    # The Cloudflare token and account id. Both sites live in the same Cloudflare account, so there
    # is one pair of secrets and `inherit` is the honest way to say so — naming them here would imply
    # a per-spec token that does not exist.
    secrets: inherit
