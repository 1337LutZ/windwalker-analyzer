name: Deploy to GitHub Pages

# Manual only. Cloudflare Pages is what publishes on a push — `cloudflare-windwalker.yml` for
# Windwalker, `cloudflare-elemental.yml` for Elemental; two workflows deploying the same commit to
# two hosts means two live copies that drift apart, and only one of them can hold the redirect URI
# registered with WarcraftLogs — the other's sign-in fails.
#
# Kept rather than deleted because it still works: it is the fallback if Cloudflare is ever the
# wrong answer, and it sets `BASE_PATH` below because a GitHub project site is served under a path
# prefix while the Cloudflare default is the domain root.
#
# **One site, whichever spec you pick.** Cloudflare gets a project per spec; a GitHub project site is
# `/<repo>/` and there is one repo, so this path cannot serve both at once — running it for Elemental
# replaces whatever it published last. The `spec` input is what makes it a choice rather than a
# Windwalker-only escape hatch, and it defaults to Windwalker because that is the site this fallback
# was written for.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: Which spec to pin this fallback build to.
        required: true
        default: windwalker
        type: choice
        options:
          - windwalker
          - elemental

permissions:
  contents: read
  pages: write
  id-token: write

# Pages has exactly one live deployment. Queue pushes instead of racing them, and never cancel a
# deploy that is already uploading — that is how a half-published site happens.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The same gates the Cloudflare workflow runs, and for the same reason it states: a deploy that
      # skips them publishes whatever happens to compile. This is a manual fallback deploy, which is
      # exactly when nobody is watching a PR check.
      - run: npm run check
      - run: npm test

      # No `static_site_generator: astro` on purpose: that option injects its own site/base, and
      # they are set explicitly below. Two sources of truth for `base` produce a site whose asset
      # URLs 404.
      - uses: actions/configure-pages@v5

      # `src/pages/preview.astro` is a development harness: it renders committed fixtures so charts
      # and copy can be checked without a token. It has no place on a public site, and removing the
      # page removes its only import of the fixture JSON, so none of that data is bundled. Both
      # publishing paths have to do this — a fallback deploy that shipped the harness would put the
      # three captured logs on the public site that the other path exists to keep off it.
      - name: Drop the fixture preview harness from the published build
        run: rm -f src/pages/preview.astro

      # A GitHub project site lives under `/<repo>/`. The build defaults to the domain root for
      # Cloudflare, so this path prefix has to be put back for a Pages build specifically — and it is
      # the *repository's* name, not the spec's, which is why it does not follow the input below.
      - run: npm run build
        env:
          SITE_URL: https://1337lutz.github.io
          BASE_PATH: /windwalker-analyzer
          # The spec the build is pinned to, from the dispatch input. Same channel the Cloudflare
          # deploys use: Astro inlines `PUBLIC_SPEC` and `DEFAULT_SPEC` reads it.
          PUBLIC_SPEC: ${{ inputs.spec }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
