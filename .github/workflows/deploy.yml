name: Deploy to GitHub Pages

# Manual only. Cloudflare Pages is what publishes on a push — `cloudflare.yml` — and two workflows
# deploying the same commit to two hosts means two live copies that drift apart, only one of which
# any visitor has registered with WarcraftLogs as a redirect URI. Sign-in on the other one fails.
#
# Kept rather than deleted because it still works: it is the fallback if Cloudflare is ever the
# wrong answer, and it sets `BASE_PATH` below because a GitHub project site is served under a path
# prefix while the Cloudflare default is the domain root.
#
# **It serves the whole site, every spec included.** That is new. This path used to take a `spec`
# choice input and publish one spec's front door, because Cloudflare got a project per spec while a
# GitHub project site is `/<repo>/` and there is one repo — so a run for Elemental replaced whatever
# it published last. One build serving every spec by route removes the choice: the routes land under
# the prefix, as `/windwalker-analyzer/monk/windwalker` and the rest.
#
# The prefix is the *repository's* name and not the site's, which is why it did not follow the old
# input and does not follow the Cloudflare project's new name either.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages has exactly one live deployment. Queue pushes instead of racing them, and never cancel a
# deploy that is already uploading — that is how a half-published site happens.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The same gates the Cloudflare workflow runs, and for the same reason it states: a deploy that
      # skips them publishes whatever happens to compile. This is a manual fallback deploy, which is
      # exactly when nobody is watching a PR check.
      - run: npm run check
      - run: npm test

      # No `static_site_generator: astro` on purpose: that option injects its own site/base, and
      # they are set explicitly below. Two sources of truth for `base` produce a site whose asset
      # URLs 404.
      - uses: actions/configure-pages@v5

      # `src/pages/preview.astro` is a development harness: it renders committed fixtures so charts
      # and copy can be checked without a token. It has no place on a public site, and removing the
      # page removes its only import of the fixture JSON, so none of that data is bundled. Both
      # publishing paths have to do this — a fallback deploy that shipped the harness would put the
      # three captured logs on the public site that the other path exists to keep off it.
      - name: Drop the fixture preview harness from the published build
        run: rm -f src/pages/preview.astro

      # A GitHub project site lives under `/<repo>/`. The build defaults to the domain root for
      # Cloudflare, so this path prefix has to be put back for a Pages build specifically.
      #
      # Both values are set on this step rather than on the job, the same as in
      # `deploy-cloudflare.yml` and for the reason its `env:` block records: a gate that can read a
      # build variable is a gate answering a question about the deployment rather than about the code.
      #
      # A build published from here answers to a redirect URI of its own, and that URI has to be
      # registered with WarcraftLogs separately from the Cloudflare host before anyone can sign in
      # on it: `https://1337lutz.github.io/windwalker-analyzer`, with no trailing slash, because
      # under a path prefix the slash is not part of the path. See `docs/wcl-oauth.md`.
      - run: npm run build
        env:
          SITE_URL: https://1337lutz.github.io
          BASE_PATH: /windwalker-analyzer

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
