name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the previous run's answer worthless, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm run check` is types, Astro diagnostics, oxlint and oxfmt — the same command a human
      # runs locally, so CI cannot disagree with a clean working copy.
      - name: Types, diagnostics, lint and formatting
        run: npm run check

      - name: Unit tests
        run: npm test

      # `npm run check` type-checks; it does not build. Astro only resolves the islands, runs the
      # integrations and prerenders the pages during `astro build`, so a change that broke the build
      # passed CI and failed after merge, inside the deploy — which is the worst place to find out.
      # It is the same command the deploy runs, so the two cannot disagree about what compiles.
      - name: Build
        run: npm run build
