name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the previous run's answer worthless, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Types and Astro diagnostics
        run: npm run check

      - name: Unit tests
        run: npm test
